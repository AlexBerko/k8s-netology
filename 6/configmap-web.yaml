apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-multitool-config
  namespace: default
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>Settings from ConfigMap!</title>
    </head>
    <body>
      <h1>Hello from Kubernetes!</h1>
    </body>
    </html>
  multitool_http_port: "8080"
  multitool_https_port: "8443"