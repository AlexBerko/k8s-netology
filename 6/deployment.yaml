apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-deployment
  labels:
    app: test
spec:
  replicas: 1
  selector:
    matchLabels:
      app1: nginx
      app2: multitool
  template:
    metadata:
      labels:
        app1: nginx
        app2: multitool
    spec:
      containers:
      - name: nginx
        image: nginx:1.30.6
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-config
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html
      
      - name: multitool
        image: wbitt/network-multitool:3.24
        env:
        - name: HTTP_PORT
          valueFrom:
            configMapKeyRef:
              name: nginx-multitool-config
              key: multitool_http_port 
        - name: HTTPS_PORT
          valueFrom:
            configMapKeyRef:
              name: nginx-multitool-config
              key: multitool_https_port
        ports:
        - containerPort: 8080

      volumes:
      - name: nginx-config
        configMap:
          name: nginx-multitool-config
          items:
          - key: index.html
            path: index.html
---
apiVersion: v1
kind: Service
metadata:
  name: service-nginx-multitool-nodeport
spec:
  type: NodePort
  selector:
      app1: nginx
      app2: multitool
  ports:
    - name: nginx
      protocol: TCP
      port: 9001
      targetPort: 80
      nodePort: 30001
    - name: multitool
      protocol: TCP
      port: 9002
      targetPort: 8080
      nodePort: 30002
    