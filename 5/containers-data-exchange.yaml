apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-exchange
  labels:
    app: data-exchange
spec:
  replicas: 1
  selector:
    matchLabels:
      app1: busybox
      app2: multitool
  template:
    metadata:
      labels:
        app1: busybox
        app2: multitool
    spec:
      containers:
      - name: busybox
        image: busybox
        command: ["sh", "-c", "while true; do echo \"test $(date '+%Y-%m-%d %H:%M:%S')\" >> /output/test.txt && sleep 5; done"]
        volumeMounts:
        - name: shared-data
          mountPath: /output
      - name: multitool
        image: wbitt/network-multitool:3.24
        volumeMounts:
        - name: shared-data
          mountPath: /input
      volumes:
      - name: shared-data
        emptyDir: {}