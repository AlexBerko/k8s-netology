apiVersion: v1
kind: Service
metadata:
  name: service-nginx-multitool-nodeport
spec:
  type: NodePort
  selector:
      app1: nginx
      app2: multitool
  ports:
    - name: nginx
      protocol: TCP
      port: 9001
      targetPort: 80
      nodePort: 30001
    - name: multitool
      protocol: TCP
      port: 9002
      targetPort: 8080
      nodePort: 30002
    