apiVersion: v1
kind: Service
metadata:
  name: service-nginx-multitool
spec:
  selector:
      app1: nginx
      app2: multitool
  ports:
    - name: nginx
      protocol: TCP
      port: 9001
      targetPort: 80
    - name: multitool
      protocol: TCP
      port: 9002
      targetPort: 8080
    